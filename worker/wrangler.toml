# Fate Lost multiplayer: one Worker, two Durable Object classes.
#
# The top level is PRODUCTION (the existing worker, fate-lost-multiplayer).
# `--env staging` deploys a separate worker with its own Durable Objects, so
# a bad release can be tried and thrown away without touching real parties.
#
# Nothing in this file is secret. There are no API keys in the app or here:
# deployment uses `wrangler login` on the developer's machine.

name = "fate-lost-multiplayer"
main = "src/index.ts"
compatibility_date = "2025-11-01"
workers_dev = true
# Only the workers.dev address is served; no per-version preview URLs.
preview_urls = false

# Logging. Workers Logs writes an "invocation log" for every request AND for
# every WebSocket message a Durable Object handles, which in a run is dozens a
# second per player (about 36,000 events for two 15-minute sessions). Those are
# switched off. What stays is what the code writes on purpose: a one-line
# error class when something unexpected fails, which is rare. No metrics,
# traces or per-message logs are kept.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

[vars]
ENVIRONMENT = "production"
# PBKDF2-SHA256 rounds for lobby passwords.
PBKDF2_ITERATIONS = "20000"

[[durable_objects.bindings]]
name = "PARTY_ROOM"
class_name = "PartyRoom"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# SQLite-backed classes are the only kind available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PartyRoom", "RateLimiter"]

[env.staging]
name = "fate-lost-multiplayer-staging"
workers_dev = true
preview_urls = false

[env.staging.observability]
enabled = true

[env.staging.observability.logs]
enabled = true
invocation_logs = false

[env.staging.vars]
ENVIRONMENT = "staging"
PBKDF2_ITERATIONS = "20000"

[[env.staging.durable_objects.bindings]]
name = "PARTY_ROOM"
class_name = "PartyRoom"

[[env.staging.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["PartyRoom", "RateLimiter"]

# Local only: short lifetimes so the automated tests can watch a lobby expire
# and a host time out. Never deployed (`npm test` runs it with wrangler dev).
[env.test]
name = "fate-lost-multiplayer-test"

[env.test.vars]
ENVIRONMENT = "test"
PBKDF2_ITERATIONS = "1000"
HOST_GRACE_RUN_MS = "1500"
HOST_GRACE_LOBBY_MS = "1500"
ABANDONED_MS = "2500"
IDLE_LOBBY_MS = "60000"

[[env.test.durable_objects.bindings]]
name = "PARTY_ROOM"
class_name = "PartyRoom"

[[env.test.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[env.test.migrations]]
tag = "v1"
new_sqlite_classes = ["PartyRoom", "RateLimiter"]
