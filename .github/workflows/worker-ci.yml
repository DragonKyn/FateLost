name: Multiplayer worker

# Typechecks and tests the Cloudflare Worker behind multiplayer. It never
# deploys: deployment is run by a person with `wrangler login` (see
# docs/MULTIPLAYER_RUNBOOK.md), so no Cloudflare credential lives in GitHub.

on:
  push:
    paths:
      - "worker/**"
      - ".github/workflows/worker-ci.yml"
  pull_request:
    paths:
      - "worker/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Integration tests against a local Worker
        run: node scripts/with-dev-server.mjs npm run test:integration
