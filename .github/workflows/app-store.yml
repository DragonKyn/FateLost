name: App Store upload

# Archives a signed store build of Fate Lost and uploads it to App Store
# Connect, where it appears in TestFlight once Apple has processed it.
#
# Run by hand only (Actions → App Store upload → Run workflow), so nothing
# reaches Apple by accident. Signing is automatic, driven by an App Store
# Connect API key: no certificates or profiles are kept in the repository.
#
# Repository secrets it needs:
#   APPSTORE_KEY_ID       Key ID of an App Store Connect team API key (Admin role)
#   APPSTORE_ISSUER_ID    Issuer ID shown above the keys list
#   APPSTORE_PRIVATE_KEY  Full text of the downloaded AuthKey_XXXX.p8
#   APPLE_TEAM_ID         10-character developer Team ID
#
# A store build has no developer tools compiled in, so it serves the
# production AdMob unit rather than Google's test unit.

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Version shown on the App Store (blank keeps the project's MARKETING_VERSION)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: app-store-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60

    env:
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUILD_NUMBER: ${{ github.run_number }}${{ github.run_attempt }}

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Check secrets are set
        env:
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          missing=0
          for name in KEY_ID ISSUER_ID TEAM_ID PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Secret for $name is not set"; missing=1; fi
          done
          exit $missing

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest"
          fi
          xcodebuild -version

      - name: Check the app icon has no transparency
        run: |
          set -euo pipefail
          icon=FateLost/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$icon"
          if sips -g hasAlpha "$icon" | grep -q "hasAlpha: yes"; then
            echo "::error::App Store icons must not have an alpha channel: $icon"
            exit 1
          fi

      - name: Render audio
        run: |
          set -euo pipefail
          python3 -m venv .audio-venv
          .audio-venv/bin/pip install --quiet numpy
          .audio-venv/bin/python tools/audio/render_audio.py | tee audio-render.log
          cd FateLost/Resources/Audio
          for f in mus_*.wav amb_*.wav; do
            afconvert -f m4af -d aac -b 160000 "$f" "${f%.wav}.m4a"
            rm "$f"
          done

      - name: Install the API key
        env:
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          printf '%s\n' "$PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          echo "KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Archive (signed, Release, no developer tools)
        id: archive
        run: |
          set -o pipefail
          version_setting=()
          if [ -n "${{ inputs.marketing_version }}" ]; then
            version_setting=(MARKETING_VERSION="${{ inputs.marketing_version }}")
          fi
          echo "Build number: $BUILD_NUMBER"
          xcodebuild archive \
            -project FateLost.xcodeproj \
            -scheme FateLost \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FateLost.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${version_setting[@]}" 2>&1 | tee archive.log

      - name: Export and upload to App Store Connect
        id: upload
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          plutil -lint ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/FateLost.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" 2>&1 | tee upload.log

      - name: Summarise
        if: always()
        run: |
          set +e
          app=build/FateLost.xcarchive/Products/Applications/FateLost.app
          {
            echo "run ${{ github.run_number }} attempt ${{ github.run_attempt }} · commit ${{ github.sha }} · $(date -u)"
            echo "=== archive: ${{ steps.archive.outcome }} · upload: ${{ steps.upload.outcome }}"
            echo "=== version / build"
            plutil -extract CFBundleShortVersionString raw "$app/Info.plist" 2>&1
            plutil -extract CFBundleVersion raw "$app/Info.plist" 2>&1
            plutil -extract CFBundleIdentifier raw "$app/Info.plist" 2>&1
            echo "=== advert id"
            plutil -extract GADApplicationIdentifier raw "$app/Info.plist" 2>&1
            echo "=== signing"
            codesign -dv "$app" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier"
            echo "=== archive errors"
            grep -nE "(error:|\*\* ARCHIVE (SUCCEEDED|FAILED))" archive.log 2>&1 | head -80
            echo "=== upload"
            grep -nE "(error|Error|EXPORT (SUCCEEDED|FAILED)|Upload|upload)" upload.log 2>&1 | head -80
          } > appstore-report.txt 2>&1
          cat appstore-report.txt

      # Actions logs need a signed-in session, so the report is also pushed
      # to its own branch where it can be read through the contents API.
      - name: Publish the report
        if: always()
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          cp appstore-report.txt archive.log upload.log "$workdir/" 2>/dev/null || true
          cd "$workdir"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "App Store upload run ${{ github.run_number }}" --allow-empty
          git branch -M appstore-logs
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" appstore-logs

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
